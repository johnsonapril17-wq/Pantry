# Render Blueprint. The dashboard fields are the same three values:
#   Root Directory   : (blank)
#   Build Command    : npm run build
#   Publish Directory: dist
#
# No rewrite rule is needed. The app uses HashRouter, so every route lives
# after the '#' and the server only ever serves /index.html.
services:
  - type: web
    name: pantry-tracker
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
